# ARMENU Nginx — 8 zona, limit_req, real_ip (CF)
upstream web {
    server 127.0.0.1:8060;
}

upstream ws {
    server 127.0.0.1:8061;
}

# Rate limit zonalar (3+ zona: general, api, auth, orders)
limit_req_zone $binary_remote_addr zone=general:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=orders:10m rate=10r/m;
limit_req_status 429;

server {
    listen 80;
    server_name _;

    # Maintenance mode check
    set $maint 0;
    if (-f /opt/armenu/MAINTENANCE) { set $maint 1; }
    if ($http_x_armenu_bypass) { set $maint 0; }
    if ($request_uri ~ ^/(health|ready)) { set $maint 0; }
    if ($maint = 1) { return 503; }

    error_page 503 @maintenance;
    location @maintenance {
        root /opt/armenu/templates/errors;
        try_files /503.html /maintenance.html =503;
        add_header Retry-After 300 always;
        add_header Cache-Control "no-store" always;
        internal;
    }


    # Real IP (Cloudflare)
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 108.162.192.0/18;
    real_ip_header CF-Connecting-IP;

    # Security headers
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Static files
    location /static/ {
        alias /opt/armenu/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Favicon
    location = /favicon.ico {
        alias /opt/armenu/static/favicon.ico;
        expires 365d;
    }

    # API — rate limit
    location /v1/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Auth — qattiq rate limit
    location /v1/auth/ {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Orders — rate limit
    location /v1/orders/ {
        limit_req zone=orders burst=10 nodelay;
        proxy_pass http://web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket
    location /ws/ {
        proxy_pass http://ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }

    # Health endpoints
    location /health/ {
        proxy_pass http://web;
        access_log off;
    }
    location /ready/ {
        proxy_pass http://web;
        access_log off;
    }

    # KDS
    location /kds/ {
        proxy_pass http://web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Staff
    location /staff/ {
        proxy_pass http://web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Boshqa hamma narsa
    location / {
        proxy_pass http://web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
