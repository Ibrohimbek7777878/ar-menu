name: store_guliston
description: Yangiyer & Guliston offline-first e-commerce app - serverless, APK-ready
version: 1.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  provider: ^6.1.0

  # Navigation
  go_router: ^14.0.0

  # Database
  sqflite: ^2.3.0
  path_provider: ^2.1.0
  path: ^1.9.0

  # HTTP
  http: ^1.2.0

  # UI & Fonts
  google_fonts: ^6.1.0
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  fl_chart: ^0.69.0
  lottie: ^3.1.0
  flutter_staggered_animations: ^1.1.1
  intl: ^0.20.2
  flutter_colorpicker: ^1.0.3

  # Maps (iOS + Android universal)
  google_maps_flutter: ^2.6.0
  geolocator: ^10.1.0
  geocoding: 5.0.0
  image_picker: ^1.1.2

  # Utilities
  shared_preferences: ^2.2.0
  uuid: ^4.0.0
  url_launcher: ^6.2.0
  permission_handler: ^11.4.0
  crypto: ^3.0.0
  flutter_map: ^8.3.0
  latlong2: ^0.9.1

  # Firebase (backend — manual setup kerak)
  firebase_core: ^3.8.0
  cloud_firestore: ^5.6.0
  firebase_auth: ^5.4.0
  firebase_storage: ^12.4.0
  firebase_messaging: ^15.2.0
  firebase_crashlytics: ^4.2.0
  flutter_local_notifications: ^18.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/

flutter_native_splash:
  color: "#16A34A"
  image: assets/icons/app_icon.png
  android: true
  ios: true
