<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restoran Boshqaruv Paneli — Kirish</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body {
            background: #090d16;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-image: radial-gradient(circle at 20% 20%, rgba(245, 158, 11, 0.08) 0%, transparent 40%),
                              radial-gradient(circle at 80% 80%, rgba(239, 68, 68, 0.05) 0%, transparent 40%);
        }
        .login-box {
            width: 100%;
            max-width: 420px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 36px 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .login-header {
            text-align: center;
            margin-bottom: 28px;
        }
        .login-logo {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            box-shadow: 0 10px 25px -5px rgba(245, 158, 11, 0.4);
            margin-bottom: 16px;
        }
        .login-title {
            font-size: 22px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.5px;
        }
        .login-desc {
            font-size: 13px;
            color: #94a3b8;
            margin-top: 6px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 8px;
        }
        .form-input {
            width: 100%;
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 14px;
            padding: 13px 16px;
            font-size: 14px;
            color: #ffffff;
            outline: none;
            transition: all 0.2s;
        }
        .form-input:focus {
            border-color: #f59e0b;
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.2);
            background: rgba(30, 41, 59, 1);
        }
        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #0f172a;
            border: none;
            border-radius: 14px;
            padding: 14px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.35);
            margin-top: 10px;
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(245, 158, 11, 0.45);
        }
        .messages-box {
            margin-bottom: 20px;
        }
        .msg-error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 500;
        }
        .msg-info {
            background: rgba(59, 130, 246, 0.15);
            border: 1px solid rgba(59, 130, 246, 0.3);
            color: #93c5fd;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 13px;
        }
        .login-footer {
            margin-top: 24px;
            text-align: center;
            font-size: 13px;
            color: #64748b;
        }
        .back-link {
            color: #f59e0b;
            text-decoration: none;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: opacity 0.2s;
        }
        .back-link:hover { opacity: 0.8; }
        .roles-hint {
            margin-top: 20px;
            padding: 12px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            font-size: 11px;
            color: #94a3b8;
            line-height: 1.5;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="login-header">
            <div class="login-logo">🍽</div>
            <h1 class="login-title">Restoran Boshqaruv Paneli</h1>
            <p class="login-desc">Stollar, oshxona (KDS), ofitsiantlar va kassa nazorati</p>
        </div>

        {% if messages %}
        <div class="messages-box">
            {% for msg in messages %}
            <div class="{% if msg.tags == 'error' %}msg-error{% else %}msg-info{% endif %}">
                {{ msg }}
            </div>
            {% endfor %}
        </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label class="form-label">Foydalanuvchi nomi (Login)</label>
                <input type="text" name="username" class="form-input" placeholder="masalan: admin yoki ofitsiant1" required autofocus autocomplete="username">
            </div>

            <div class="form-group">
                <label class="form-label">Maxfiy parol</label>
                <input type="password" name="password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
            </div>

            <button type="submit" class="btn-submit">Boshqaruv Paneliga Kirish &rarr;</button>
        </form>

        <div class="roles-hint">
            🔒 Tizimga <b>Restoran egasi</b>, <b>Menejer</b>, <b>Oshpaz</b> yoki <b>Ofitsiant</b> hisobi orqali kiriladi.
        </div>

        <div class="login-footer">
            <a href="/" class="back-link">&larr; Mijoz 3D Menyusiga qaytish</a>
        </div>
    </div>
</body>
</html>
