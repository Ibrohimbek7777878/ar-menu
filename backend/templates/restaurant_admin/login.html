<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guliston — Boshqaruv Paneliga Kirish</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-cream: #F7F3EA;
            --bg-cream-soft: #FAF7F0;
            --primary-green: #2F4836;
            --primary-green-hover: #24382A;
            --accent-brown: #8B5E3C;
            --text-dark: #2C2A26;
            --text-muted: #6B6559;
            --border-cream: #E8E0CF;
            --radius-2xl: 24px;
            --radius-xl: 18px;
            --radius-pill: 9999px;
            --shadow-card: 0 10px 30px -4px rgba(44, 42, 38, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-cream);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .serif { font-family: 'Playfair Display', Georgia, serif; }

        .login-card {
            width: 100%;
            max-width: 440px;
            background: #FFFFFF;
            border: 1px solid var(--border-cream);
            border-radius: var(--radius-2xl);
            padding: 40px 32px;
            box-shadow: var(--shadow-card);
            text-align: center;
        }

        .brand-crest-big {
            width: 64px;
            height: 64px;
            border-radius: 18px;
            background: var(--primary-green);
            color: #FAF7F0;
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 32px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            box-shadow: 0 6px 18px rgba(47, 72, 54, 0.25);
        }

        .login-title {
            font-size: 26px;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 4px;
        }

        .login-subtitle {
            font-size: 11px;
            letter-spacing: 2px;
            color: var(--accent-brown);
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 28px;
        }

        .error-box {
            background: #FFF5F5;
            border: 1px solid #FEB2B2;
            color: #C53030;
            padding: 12px 14px;
            border-radius: var(--radius-xl);
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 20px;
            text-align: left;
        }

        .login-form {
            text-align: left;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 6px;
        }

        .form-field {
            width: 100%;
            background: var(--bg-cream-soft);
            border: 1px solid var(--border-cream);
            border-radius: var(--radius-xl);
            padding: 14px 18px;
            font-size: 14px;
            color: var(--text-dark);
            outline: none;
            transition: border-color 0.2s;
        }
        .form-field:focus {
            border-color: var(--primary-green);
            background: #FFFFFF;
        }

        .btn-submit-login {
            margin-top: 10px;
            background: var(--primary-green);
            color: #FFFFFF;
            border: none;
            padding: 16px;
            border-radius: var(--radius-pill);
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(47, 72, 54, 0.25);
            transition: all 0.2s;
        }
        .btn-submit-login:hover {
            background: var(--primary-green-hover);
            transform: translateY(-1px);
        }

        .back-menu-link {
            display: inline-block;
            margin-top: 24px;
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 700;
            text-decoration: none;
            transition: color 0.15s;
        }
        .back-menu-link:hover {
            color: var(--primary-green);
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="brand-crest-big">G</div>
        <h1 class="login-title serif">Guliston</h1>
        <p class="login-subtitle">Boshqaruv Markazi</p>

        {% if messages %}
        <div class="error-box">
            {% for message in messages %}
            <p>⚠️ {{ message }}</p>
            {% endfor %}
        </div>
        {% endif %}

        <form method="POST" action="{% url 'restaurant_admin_login' %}" class="login-form">
            {% csrf_token %}
            <div>
                <label class="form-label">Foydalanuvchi nomi / Login</label>
                <input type="text" name="username" placeholder="Masalan: admin" class="form-field" required autocomplete="username">
            </div>

            <div>
                <label class="form-label">Maxfiy parol</label>
                <input type="password" name="password" placeholder="••••••••" class="form-field" required autocomplete="current-password">
            </div>

            <button type="submit" class="btn-submit-login">
                Tizimga Kirish →
            </button>
        </form>

        <a href="/" class="back-menu-link">← Mehmon Menyusiga Qaytish</a>
    </div>
</body>
</html>
