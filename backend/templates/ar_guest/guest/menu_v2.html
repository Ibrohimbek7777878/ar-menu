{% load static %}<!DOCTYPE html>
<html lang="{{ lang }}" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
  <meta name="theme-color" content="#14110E">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="{% static 'favicon.ico' %}">
  <title>{{ restaurant.name }} — AIR 3D MENU</title>

  <!-- Google Fonts: Inter & Playfair Display -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,600;0,800;0,900;1,700&display=swap" rel="stylesheet">

  <script>
    (function(){
      try {
        var t = localStorage.getItem('guliston-theme') || localStorage.getItem('theme');
        if (t === 'light') {
          document.documentElement.classList.remove('dark');
          document.documentElement.removeAttribute('data-theme');
        } else {
          document.documentElement.classList.add('dark');
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      } catch(e){}
    })();
  </script>

  <!-- Compiled Tailwind CSS & Design System from air-3d-menu -->
  <link rel="stylesheet" href="{% static 'air/assets/index.css' %}?v={{ static_version }}">
</head>
<body class="pattern-bg bg-[var(--bg)] text-[var(--text)] antialiased min-h-screen">
  <div id="root"></div>

  <!-- Initial Context from Django Multi-tenant Session -->
  <script>
    window.__INITIAL_DATA__ = {
      slug: "{{ restaurant.slug }}",
      restaurant_name: "{{ restaurant.name|escapejs }}",
      table_id: "{{ table.id|default:'' }}",
      table_number: {{ table.number|default:5 }},
      session_id: "{{ session_id }}",
      lang: "{{ lang }}",
      csrf_token: "{{ csrf_token }}"
    };
  </script>

  <!-- Compiled React 19 Application -->
  <script type="module" src="{% static 'air/assets/index.js' %}?v={{ static_version }}"></script>

  <!-- Legacy fallback references for no-JS environments -->
  <noscript>
    <script src="{% static 'guest/js/dish.js' %}"></script>
    <script src="{% static 'guest/js/chatbot.js' %}"></script>
    <button id="btnChat"></button>
  </noscript>
</body>
</html>
