{% load i18n %}<!-- AR modal — to'liq ekrandan biroz kichikroq katta 3D showcase -->
<div class="ar-modal" id="arModal" hidden aria-modal="true" role="dialog">
  <div class="ar-modal__backdrop" data-ar-close></div>

  <div class="ar-modal__sheet">
    <header class="ar-modal__head">
      <div style="display:flex; align-items:center; gap:10px; min-width:0;">
        <h3 class="ar-modal__title" id="arTitle">—</h3>
        <span class="ar-modal__price-tag" id="arPriceHeader"></span>
      </div>
      <button class="ar-modal__x" data-ar-close aria-label="{% trans 'Yopish' %}">✕</button>
    </header>

    <!-- 1. Yuklanmoqda -->
    <div class="ar-state" id="arLoading">
      <div class="ar-spin"></div>
      <p id="arLoadText">{% trans "3D model yuklanmoqda…" %}</p>
      <div class="ar-bar"><div class="ar-bar__fill" id="arBarFill"></div></div>
      <small id="arSize"></small>
    </div>

    <!-- 2. Ko'rish maydoni: Katta 3D model maydoni -->
    <div class="ar-stage" id="arStage" hidden></div>

    <!-- 3. 360° karusel (fallback 3) -->
    <div class="ar-360" id="ar360" hidden>
      <img id="ar360Img" alt="">
      <input type="range" id="ar360Range" min="0" max="23" value="0"
             aria-label="{% trans 'Aylantirish' %}">
      <p class="ar-hint">{% trans "Barmoq bilan suring" %}</p>
    </div>

    <!-- 4. Oddiy rasm (fallback 4) -->
    <div class="ar-plain" id="arPlain" hidden>
      <img id="arPlainImg" alt="">
      <p class="ar-note" id="arPlainNote"></p>
    </div>

    <!-- Ma'lumot va tavsif paneli -->
    <div class="ar-info-panel" id="arInfoPanel">
      <p class="ar-dish-desc" id="arDishDesc" style="margin:0 0 6px 0; font-size:13px; color:var(--text-soft); line-height:1.4; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;"></p>
      <div class="ar-meta" id="arMeta" style="display:flex; justify-content:space-between; align-items:center; font-size:12px;">
        <span>📏 {% trans "Stoldagi o'lchami:" %} <b id="arSizeCm">28</b> sm</span>
        <span id="arModeLbl" style="background:rgba(16,185,129,0.12); color:#10B981; padding:3px 8px; border-radius:6px; font-weight:700;">🔄 360° 3D</span>
      </div>
    </div>

    <!-- ⚡ Pastki panel — Stepper va Savatga Qo'shish -->
    <footer class="ar-modal__foot" style="display:flex; align-items:center; gap:10px;">
      <div class="stepper" style="flex-shrink:0;">
        <button class="stepper__btn" id="arQtyMinus" aria-label="-">−</button>
        <span class="stepper__val" id="arQty">1</span>
        <button class="stepper__btn" id="arQtyPlus" aria-label="+">+</button>
      </div>
      <button class="ar-add" id="arAddBtn" style="flex:1;">
        🛒 <span>{% trans "SAVATGA QO'SHISH" %}</span>
        <b id="arPrice"></b>
      </button>
    </footer>
  </div>
</div>
