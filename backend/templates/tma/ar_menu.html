{% block extra_head %}

<!-- React Component System CSS -->
<link rel="stylesheet" href="/static/react/assets/index.css?v=21">
{% endblock %}

{% block desktop_nav %}
<!-- React o'zining HeaderNav komponentini render qiladi -->
{% endblock %}

<div id="root"></div>

<script>

<!-- React Application Bundle -->
<script type="module" src="/static/react/assets/index.js?v=21"></script>
