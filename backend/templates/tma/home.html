{% extends "tma/base_tma.html" %}
{% load json_tags %}

{% block title %}Dasturxon Menyusi — {{ shop.name|default:"Guliston" }}{% endblock %}

{% block extra_head %}
<!-- Google model-viewer 3D kutubxonasi -->
<script type="module" src="https://unpkg.com/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>

<!-- React Component System CSS -->
<link rel="stylesheet" href="/static/react/assets/index.css?v=24">
{% endblock %}

{% block desktop_nav %}
<!-- React o'zining HeaderNav komponentini render qiladi -->
{% endblock %}

{% block content %}
<!-- React Mount Root & 3D AR Container -->
<div id="root"></div>
<div id="hero-3d-viewer" style="display:none;" data-status="ready"></div>

<script>
    // Server tomonidan uzatilgan real restoran ma'lumotlari
    window.__GULISTON_DATA__ = {{ react_initial_data_json|script_json }};
</script>

<!-- React Application Bundle -->
<script type="module" src="/static/react/assets/index.js?v=24"></script>
{% endblock %}

{% block tabbar %}
<!-- React o'zining BottomNav komponentini render qiladi -->
{% endblock %}
