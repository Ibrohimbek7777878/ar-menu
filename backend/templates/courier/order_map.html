{% extends "base_courier.html" %}
{% block title %}Buyurtma xaritasi — Kuryer{% endblock %}

{% block content %}
<div style="max-width:640px;margin:0 auto;padding:24px 16px;">

  <a href="/courier/order/{{ order.pk }}/" style="color:#16a34a;text-decoration:none;font-size:14px;">← Buyurtmaga qaytish</a>

  <h1 style="font-family:'Fraunces',serif;font-size:22px;font-weight:700;color:#1a1a1a;margin:12px 0 4px;">
    📍 Yetkazish manzili
  </h1>
  <p style="color:#6b7280;font-size:14px;margin-bottom:16px;">{{ order.delivery_address|default:"Manzil ko'rsatilmagan" }}</p>

  <div id="map" style="width:100%;height:400px;border-radius:12px;border:1px solid #e5e7eb;"></div>

  <div style="margin-top:16px;display:flex;gap:12px;">
    <a href="https://www.google.com/maps/dir/?api=1&destination={{ order.delivery_lat|default:'' }},{{ order.delivery_lng|default:'' }}" 
       target="_blank" style="
      flex:1;padding:12px;background:#16a34a;color:white;text-align:center;
      border-radius:10px;text-decoration:none;font-weight:600;font-size:14px;
    ">🗺 Yo'nalish olish</a>
    <a href="tel:{{ order.customer_phone_1 }}" style="
      flex:1;padding:12px;background:#f3f4f6;color:#1a1a1a;text-align:center;
      border-radius:10px;text-decoration:none;font-weight:600;font-size:14px;
    ">📞 Qo'ng'iroq</a>
  </div>
</div>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function(){
  var lat = {{ order.delivery_lat|default:"40.4775" }};
  var lng = {{ order.delivery_lng|default:"66.8435" }};

  var map = L.map('map').setView([lat, lng], 15);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap'
  }).addTo(map);

  L.marker([lat, lng]).addTo(map).bindPopup('Yetkazish manzili').openPopup();

  // Kuryer joylashuvini tekshirish
  function checkCourierLocation() {
    fetch('/map/courier-location/{{ order.pk }}/')
      .then(function(r){ return r.json(); })
      .then(function(data){
        if (data.success && data.lat && data.lng) {
          L.marker([data.lat, data.lng]).addTo(map)
            .bindPopup('🚗 Kuryer: ' + data.name);
        }
      });
  }
  checkCourierLocation();
  setInterval(checkCourierLocation, 10000); // Har 10 sekundda yangilash
})();
</script>
{% endblock %}
